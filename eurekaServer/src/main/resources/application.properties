spring.application.name=eurekaServer

server.port=${PORT:9978}

# ==========================================
# 2. SERVER SELF-PRESERVATION (CRITICAL)
# ==========================================
# Default is true. In production, leaving it ENABLED is recommended
# to prevent mass eviction during network partitions.
#Self-Preservation (enable-self-preservation=true): This is one of the most important production setting. It tells the server to stop evicting instances when it loses heartbeats from a large percentage of services. This prevents a cascading failure where a temporary network blip causes the registry to wipe out all healthy service instances
eureka.server.enable-self-preservation=true
#Eviction Interval: Setting this to 60000 (1 minute) reduces the frequency of cleanup checks, lowering CPU overhead slightly compared to the default.
eureka.server.eviction-interval-timer-in-ms=60000



# ==========================================
# 3. SERVER REGISTRY BEHAVIOR
# ==========================================
# The server should NOT register with itself (unless part of a peer cluster)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false


logging.level.com.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG


