spring.application.name=userAccountsAndAuthentication
server.servlet.context-path=/userAccountsAndAuthentication

spring.profiles.active=dev
spring.config.import=optional:configserver
spring.cloud.config.enabled=false

# ==========================================
# 1. SERVER CONFIGURATION
# ==========================================
server.port=4000
#server.shutdown=graceful combined with spring.lifecycle.timeout-per-shutdown-phase=20s ensures that when your application receives a SIGTERM (e.g., during a Kubernetes rolling update), it stops accepting new requests and waits for in-flight requests to complete before shutting down the connection pool and exiting. This prevents 502 errors for your users during deployments.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

#eureka
# Prefer IP address over hostname in containerized/cloud environments
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:9978/eureka
# ==========================================
# 3. HEALTH CHECK PROPAGATION (Critical)
# ==========================================
#health check - By default, Eureka only checks if the client is sending heartbeats. If your application is running but the database connection is down, Eureka still says it is "UP". Enabling this propagates the true Actuator health status, so traffic is not routed to unhealthy instances
eureka.client.healthcheck.enabled=true


# ==========================================
# 2. DATASOURCE / MYSQL CONNECTION
# ==========================================
# Use environment variables for sensitive data.
# Example URL includes timezone and SSL parameters.

# JDBC URL for MySQL (includes timezone and SSL parameters for compatibility)
# spring.datasource.url=jdbc:mysql://localhost:3306/EVENTS_DB
#spring.datasource.url=jdbc:mysql://localhost:3306/your_database_name?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/events_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL JDBC Driver (required for MySQL 8+)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database credentials
spring.datasource.username=root
spring.datasource.password=Robin

# Display SQL statements in the console (useful for debugging)
spring.jpa.show-sql=true

# Pretty-print the SQL output
spring.jpa.properties.hibernate.format_sql=true

spring.threads.virtual.enabled=true




